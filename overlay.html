<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
    <title>PAUL Overlay</title>

    <style>
        html,
        body
        {
            margin:      0;
            padding:     0;
            width:       100vw;
            height:      100vh;
            background:  transparent;
            overflow:    hidden;
            font-family: Inter, system-ui, sans-serif;
            color:       #f1efe9;
        }


        .pinned-notes
        {
            position:       fixed;
            top:            16px;
            right:          16px;
            display:        flex;
            flex-direction: column;
            gap:            8px;
            width:          280px;
            max-height:     calc(100vh - 32px);
            overflow:       hidden;
            pointer-events: none;
        }


        .task-card
        {
            position:       fixed;
            top:            16px;
            left:           16px;
            width:          320px;
            border-radius:  8px;
            border:         1px solid rgba(52, 152, 219, 0.6);
            background:     rgba(12, 12, 12, 0.92);
            padding:        12px;
            pointer-events: none;
        }


        .task-card.is-hidden
        {
            display: none;
        }


        .task-card-title
        {
            font-size:      0.75rem;
            font-weight:    600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color:          #8d887e;
            margin-bottom:  4px;
        }


        .task-card-headline
        {
            font-size:     0.95rem;
            font-weight:   600;
            margin-bottom: 6px;
        }


        .task-card-line
        {
            font-size: 0.82rem;
            color:     #d1ccc2;
        }


        .task-card-warning
        {
            margin-top: 6px;
            font-size:  0.8rem;
            color:      #f39c12;
        }


        .task-card-hint
        {
            margin-top: 8px;
            font-size:  0.72rem;
            color:      #8d887e;
        }


        .pinned-note
        {
            border-radius: 8px;
            border:        1px solid rgba(127, 127, 127, 0.35);
            background:    rgba(12, 12, 12, 0.90);
            padding:       12px;
        }


        .pinned-note-title
        {
            font-size:     0.9rem;
            font-weight:   600;
            margin-bottom: 4px;
            overflow-wrap: anywhere;
        }


        .pinned-note-content
        {
            font-size:     0.85rem;
            color:         #d1ccc2;
            white-space:   pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>


<body>
    <div id="taskCard" class="task-card is-hidden"></div>
    <div id="pinnedNotes" class="pinned-notes"></div>

    <script src="./overlay.js"></script>
</body>
</html>
