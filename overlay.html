<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>PAUL Overlay</title>


    <style>
        html,
        body
        {
            margin:      0;
            padding:     0;
            width:       100vw;
            height:      100vh;
            background:  transparent;
            overflow:    hidden;
            font-family: Inter, system-ui, sans-serif;
            color:       #f1efe9;
        }


        /* Note épinglée (visuel seul, ne bloque pas le jeu) */
        .overlay-pinned-note
        {
            position:       fixed;
            top:            16px;
            right:          16px;
            max-width:      260px;
            border-radius:  8px;
            border:         1px solid rgba(127, 127, 127, 0.35);
            background:     rgba(12, 12, 12, 0.90);
            padding:        12px;
            pointer-events: none;
            z-index:        1;
        }


        .overlay-pinned-note-title
        {
            font-size:   0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
        }


        .overlay-pinned-note-content
        {
            font-size: 0.85rem;
            color:     #d1ccc2;
        }
    </style>
</head>


<body>
    <!-- Note épinglée -->
    <div id="overlayPinnedNote" class="overlay-pinned-note" style="display:none;">
        <div id="overlayPinnedNoteTitle" class="overlay-pinned-note-title"></div>
        <div id="overlayPinnedNoteContent" class="overlay-pinned-note-content"></div>
    </div>


    <script>
        const noteEl        = document.getElementById("overlayPinnedNote");
        const noteTitleEl   = document.getElementById("overlayPinnedNoteTitle");
        const noteContentEl = document.getElementById("overlayPinnedNoteContent");


        window.addEventListener("message", (event) =>
        {
            if (event.data && event.data.type === "overlay:pinNote")
            {
                const payload = event.data.payload;


                noteTitleEl.textContent   = payload.note.title;
                noteContentEl.textContent = payload.note.content;
                noteEl.style.display      = "block";
            }


            if (event.data && event.data.type === "overlay:unpinNote")
            {
                noteEl.style.display = "none";
            }
        });
    </script>
</body>
</html>
