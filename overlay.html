<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
    <title>PAUL Overlay</title>

    <style>
        html,
        body
        {
            margin:      0;
            padding:     0;
            width:       100vw;
            height:      100vh;
            background:  transparent;
            overflow:    hidden;
            font-family: Inter, system-ui, sans-serif;
            color:       #f1efe9;
        }


        .pinned-notes
        {
            position:       fixed;
            top:            16px;
            right:          16px;
            display:        flex;
            flex-direction: column;
            gap:            8px;
            width:          280px;
            max-height:     calc(100vh - 32px);
            overflow:       hidden;
            pointer-events: none;
        }


        .pinned-note
        {
            border-radius: 8px;
            border:        1px solid rgba(127, 127, 127, 0.35);
            background:    rgba(12, 12, 12, 0.90);
            padding:       12px;
        }


        .pinned-note-title
        {
            font-size:     0.9rem;
            font-weight:   600;
            margin-bottom: 4px;
            overflow-wrap: anywhere;
        }


        .pinned-note-content
        {
            font-size:     0.85rem;
            color:         #d1ccc2;
            white-space:   pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>


<body>
    <div id="pinnedNotes" class="pinned-notes"></div>

    <script src="./overlay.js"></script>
</body>
</html>
