<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
    <title>PAUL Tâches</title>

    <style>
        html,
        body
        {
            margin:      0;
            padding:     0;
            width:       100%;
            height:      100%;
            background:  rgba(12, 12, 12, 0.95);
            font-family: Inter, system-ui, sans-serif;
            color:       #f1efe9;
            overflow:    hidden;
        }


        .panel-root
        {
            display:        flex;
            flex-direction: column;
            padding:        16px;
            gap:            14px;
            height:         100%;
            box-sizing:     border-box;
            overflow-y:     auto;
            border-left:    1px solid rgba(127, 127, 127, 0.35);
        }


        .panel-top
        {
            display:         flex;
            justify-content: space-between;
            align-items:     flex-start;
            gap:             8px;
        }


        .panel-header
        {
            font-size:      0.9rem;
            font-weight:    600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color:          #b8b4ab;
        }


        .panel-profile
        {
            margin-top: 2px;
            font-size:  0.8rem;
            color:      #8d887e;
        }


        .panel-empty
        {
            font-size: 0.85rem;
            color:     #8d887e;
        }


        .task-list
        {
            display:        flex;
            flex-direction: column;
            gap:            6px;
        }


        .task-button
        {
            text-align:    left;
            border-radius: 6px;
            border:        1px solid rgba(127, 127, 127, 0.35);
            background:    rgba(24, 24, 24, 1);
            padding:       8px 10px;
        }


        .task-button.is-selected
        {
            border-color: rgba(52, 152, 219, 0.7);
        }


        .task-description
        {
            font-size: 0.82rem;
            color:     #b8b4ab;
            line-height: 1.4;
        }


        .task-form
        {
            display:        flex;
            flex-direction: column;
            gap:            12px;
        }


        .field
        {
            display:        flex;
            flex-direction: column;
            gap:            4px;
        }


        .field-label
        {
            font-size:   0.85rem;
            font-weight: 600;
        }


        .field-hint
        {
            font-size: 0.75rem;
            color:     #8d887e;
        }


        .field-error
        {
            font-size: 0.78rem;
            color:     #e74c3c;
        }


        .field-checkbox
        {
            flex-direction: row;
            align-items:    center;
            gap:            8px;
        }


        input[type="text"],
        input[type="number"]
        {
            width:         100%;
            box-sizing:    border-box;
            border-radius: 4px;
            border:        1px solid rgba(127, 127, 127, 0.35);
            background:    rgba(24, 24, 24, 1);
            color:         #f1efe9;
            font-family:   inherit;
            font-size:     0.85rem;
            padding:       6px 8px;
        }


        input:focus
        {
            outline:      none;
            border-color: rgba(52, 152, 219, 0.7);
        }


        .is-hidden
        {
            display: none !important;
        }


        .dropdown
        {
            display:        flex;
            flex-direction: column;
            gap:            4px;
        }


        .dropdown-toggle
        {
            width:         100%;
            box-sizing:    border-box;
            text-align:    left;
            border:        1px solid rgba(127, 127, 127, 0.35);
            background:    rgba(24, 24, 24, 1);
            padding:       6px 8px;
            font-size:     0.85rem;
        }


        .dropdown-list
        {
            display:        flex;
            flex-direction: column;
            gap:            2px;
            max-height:     200px;
            overflow-y:     auto;
            border-radius:  4px;
            border:         1px solid rgba(127, 127, 127, 0.25);
            padding:        4px;
        }


        .dropdown-option
        {
            text-align:  left;
            background:  transparent;
            padding:     5px 6px;
            font-size:   0.8rem;
            color:       #d1ccc2;
        }


        .dropdown-option.is-selected
        {
            background: rgba(52, 152, 219, 0.25);
            color:      #f1efe9;
        }


        .dropdown-toggle:hover:not(:disabled),
        .dropdown-option:hover:not(:disabled)
        {
            background: rgba(52, 152, 219, 0.2);
        }


        .preset-section
        {
            display:        flex;
            flex-direction: column;
            gap:            6px;
        }


        .preset-row
        {
            display:         flex;
            justify-content: space-between;
            align-items:     center;
            gap:             6px;
            border-radius:   6px;
            border:          1px solid rgba(127, 127, 127, 0.25);
            background:      rgba(24, 24, 24, 1);
            padding:         6px 8px;
        }


        .preset-label
        {
            display:     flex;
            flex-wrap:   wrap;
            align-items: center;
            gap:         6px;
            min-width:   0;
            font-size:   0.85rem;
        }


        .preset-name
        {
            font-weight:   600;
            overflow-wrap: anywhere;
        }


        .preset-actions
        {
            display:     flex;
            gap:         4px;
            flex-shrink: 0;
        }


        .preset-message
        {
            font-size: 0.8rem;
            color:     #2ecc71;
        }


        .preset-message.is-error
        {
            color: #e74c3c;
        }


        button.danger
        {
            background: #e74c3c;
        }


        .items-control
        {
            display:        flex;
            flex-direction: column;
            gap:            4px;
        }


        .amount-rows
        {
            display:        flex;
            flex-direction: column;
            gap:            4px;
        }


        .amount-row
        {
            display:               grid;
            grid-template-columns: 1fr 90px 28px;
            align-items:           center;
            gap:                   4px 6px;
        }


        .amount-name
        {
            font-size:     0.82rem;
            font-weight:   600;
            overflow-wrap: anywhere;
        }


        .amount-hint
        {
            grid-column: 1 / -1;
            font-size:   0.72rem;
            color:       #8d887e;
        }


        .amount-hint:empty
        {
            display: none;
        }


        .amount-remove
        {
            padding:    4px 0;
            background: rgba(127, 127, 127, 0.3);
        }


        .chips
        {
            display:   flex;
            flex-wrap: wrap;
            gap:       4px;
        }


        .chip
        {
            border-radius: 12px;
            background:    rgba(52, 152, 219, 0.35);
            padding:       3px 8px;
            font-size:     0.75rem;
        }


        .item-options
        {
            display:        flex;
            flex-direction: column;
            gap:            2px;
            max-height:     150px;
            overflow-y:     auto;
            border-radius:  4px;
            border:         1px solid rgba(127, 127, 127, 0.25);
            padding:        4px;
        }


        .item-option
        {
            display:         flex;
            justify-content: space-between;
            text-align:      left;
            background:      transparent;
            padding:         4px 6px;
            font-size:       0.8rem;
            color:           #d1ccc2;
        }


        .item-option.is-selected
        {
            background: rgba(52, 152, 219, 0.25);
            color:      #f1efe9;
        }


        .result
        {
            border-radius: 6px;
            padding:       10px;
            font-size:     0.82rem;
            line-height:   1.5;
        }


        .result.is-valid
        {
            border:     1px solid rgba(46, 204, 113, 0.6);
            background: rgba(46, 204, 113, 0.08);
        }


        .result.is-invalid
        {
            border:     1px solid rgba(231, 76, 60, 0.6);
            background: rgba(231, 76, 60, 0.08);
        }


        .result-title
        {
            font-weight: 600;
            margin-bottom: 4px;
        }


        .result-group
        {
            display:        flex;
            flex-direction: column;
            gap:            10px;
        }


        .report
        {
            display:        flex;
            flex-direction: column;
            gap:            8px;
            border-radius:  6px;
            border:         1px solid rgba(52, 152, 219, 0.5);
            background:     rgba(52, 152, 219, 0.06);
            padding:        10px;
            font-size:      0.82rem;
            line-height:    1.45;
        }


        .report-headline
        {
            font-size:   0.9rem;
            font-weight: 600;
        }


        .report-step
        {
            border-left:  2px solid rgba(52, 152, 219, 0.6);
            padding-left: 8px;
        }


        .report-step-title
        {
            font-weight:   600;
            margin-bottom: 2px;
        }


        .report-line
        {
            color: #d1ccc2;
        }


        .report-note.is-warning
        {
            color: #f39c12;
        }


        .report-note.is-info
        {
            color: #8d887e;
        }


        button
        {
            border-radius: 4px;
            border:        none;
            padding:       6px 10px;
            font-family:   inherit;
            font-size:     0.8rem;
            cursor:        pointer;
            background:    #3498db;
            color:         #f1efe9;
        }


        button:hover:not(:disabled)
        {
            background: #2980b9;
        }


        button.secondary
        {
            background: rgba(127, 127, 127, 0.3);
        }


        button.secondary:hover:not(:disabled)
        {
            background: rgba(127, 127, 127, 0.5);
        }


        .task-button:hover:not(:disabled),
        .item-option:hover:not(:disabled)
        {
            background: rgba(52, 152, 219, 0.2);
        }
    </style>
</head>


<body>
    <div class="panel-root">
        <div class="panel-top">
            <div>
                <div class="panel-header">PAUL · Tâches</div>
                <div id="contextLabel" class="panel-profile"></div>
            </div>

            <button id="closeButton" class="secondary" type="button" aria-label="Fermer le panneau">✕</button>
        </div>

        <div id="taskList" class="task-list"></div>

        <div id="taskDetails"></div>
    </div>

    <script src="./dropdown.js"></script>
    <script src="./tasks-panel.js"></script>
</body>
</html>
