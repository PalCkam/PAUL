<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
    <title>PAUL Notes</title>

    <style>
        html,
        body
        {
            margin:      0;
            padding:     0;
            width:       100%;
            height:      100%;
            background:  rgba(12, 12, 12, 0.95);
            font-family: Inter, system-ui, sans-serif;
            color:       #f1efe9;
            overflow:    hidden;
        }


        .panel-root
        {
            display:        flex;
            flex-direction: column;
            padding:        16px;
            gap:            12px;
            height:         100%;
            box-sizing:     border-box;
            overflow-y:     auto;
        }


        .panel-top
        {
            display:         flex;
            justify-content: space-between;
            align-items:     flex-start;
            gap:             8px;
        }


        .panel-header
        {
            font-size:      0.9rem;
            font-weight:    600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color:          #b8b4ab;
        }


        .panel-profile
        {
            margin-top: 2px;
            font-size:  0.8rem;
            color:      #8d887e;
        }


        .panel-section-title
        {
            font-size:      0.8rem;
            font-weight:    600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color:          #8d887e;
            margin-bottom:  6px;
        }


        .panel-empty
        {
            font-size: 0.85rem;
            color:     #8d887e;
        }


        .panel-note
        {
            display:        flex;
            flex-direction: column;
            gap:            6px;
            border-radius:  6px;
            border:         1px solid rgba(127, 127, 127, 0.35);
            padding:        10px;
            background:     rgba(24, 24, 24, 1);
            margin-bottom:  8px;
        }


        .panel-note.is-pinned
        {
            border-color: rgba(52, 152, 219, 0.7);
        }


        .panel-note-title,
        .panel-note-content
        {
            width:         100%;
            box-sizing:    border-box;
            border-radius: 4px;
            border:        1px solid transparent;
            background:    transparent;
            color:         #f1efe9;
            font-family:   inherit;
            padding:       4px 6px;
        }


        .panel-note-title
        {
            font-size:   0.95rem;
            font-weight: 600;
        }


        .panel-note-content
        {
            min-height: 70px;
            font-size:  0.85rem;
            color:      #d1ccc2;
            resize:     vertical;
        }


        .panel-note-title:focus,
        .panel-note-content:focus
        {
            outline:      none;
            border-color: rgba(52, 152, 219, 0.7);
            background:   rgba(0, 0, 0, 0.35);
        }


        .panel-note-actions
        {
            display: flex;
            gap:     6px;
        }


        button
        {
            border-radius: 4px;
            border:        none;
            padding:       6px 10px;
            font-family:   inherit;
            font-size:     0.8rem;
            cursor:        pointer;
            background:    #3498db;
            color:         #f1efe9;
        }


        button:hover:not(:disabled)
        {
            background: #2980b9;
        }


        button:disabled
        {
            opacity: 0.5;
            cursor:  default;
        }


        button.secondary
        {
            background: rgba(127, 127, 127, 0.3);
        }


        button.secondary:hover:not(:disabled)
        {
            background: rgba(127, 127, 127, 0.5);
        }


        button.danger
        {
            background: #e74c3c;
        }


        button.danger:hover:not(:disabled)
        {
            background: #c0392b;
        }
    </style>
</head>


<body>
    <div class="panel-root">
        <div class="panel-top">
            <div>
                <div class="panel-header">PAUL · Notes</div>
                <div id="profileName" class="panel-profile"></div>
            </div>

            <button id="closeButton" class="secondary" type="button" aria-label="Fermer le panneau">✕</button>
        </div>

        <button id="createNoteButton" type="button">+ Nouvelle note</button>

        <div>
            <div class="panel-section-title">Épinglées</div>
            <div id="pinnedNotesList"></div>
        </div>

        <div>
            <div class="panel-section-title">Autres notes</div>
            <div id="otherNotesList"></div>
        </div>
    </div>

    <script src="./notes-panel.js"></script>
</body>
</html>
