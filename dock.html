<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
    <title>PAUL Modules</title>

    <style>
        html,
        body
        {
            margin:      0;
            padding:     0;
            width:       100%;
            height:      100%;
            background:  transparent;
            font-family: Inter, system-ui, sans-serif;
            color:       #f1efe9;
            overflow:    hidden;
            user-select: none;
        }


        .dock
        {
            display:       flex;
            gap:           8px;
            padding:       8px;
            width:         100%;
            height:        100%;
            box-sizing:    border-box;
            border-radius: 12px;
            border:        1px solid rgba(127, 127, 127, 0.35);
            background:    rgba(12, 12, 12, 0.92);
        }


        .dock-button
        {
            display:         flex;
            flex-direction:  column;
            align-items:     center;
            justify-content: center;
            gap:             4px;
            width:           56px;
            height:          56px;
            padding:         0;
            border-radius:   8px;
            border:          1px solid rgba(127, 127, 127, 0.25);
            background:      rgba(24, 24, 24, 1);
            color:           #f1efe9;
            font-family:     inherit;
            font-size:       0.65rem;
            cursor:          pointer;
        }


        .dock-button:hover
        {
            background: rgba(52, 152, 219, 0.35);
        }


        .dock-button svg
        {
            width:  22px;
            height: 22px;
        }
    </style>
</head>


<body>
    <div id="dock" class="dock"></div>

    <script src="./dock.js"></script>
</body>
</html>
